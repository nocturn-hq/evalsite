<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap"><link rel="stylesheet" href="/css/style.css"></head>
<body data-p="admin"><div class="nav"><a class="logo" href="/">YourSite</a><nav><a href="/dashboard.html">Dashboard</a><a href="#" onclick="logout()">Log out</a></nav></div><main class="wrap">
<h2>Admin panel</h2><div class="grid"><div class="card form"><h3>Add survey or video</h3><form id="tf"><input name="title" placeholder="Title" required><select name="type"><option value="survey">Survey</option><option value="video">Video</option></select><input name="url" placeholder="Link" required><input name="rewardKes" type="number" placeholder="Reward in KES" required><p class="err"></p><button>Publish</button><p id="tmsg"></p></form></div><div class="card form"><h3>Payout day</h3><form id="pf"><input name="date" type="date" required><p class="err"></p><button>Save date</button><p id="pmsg"></p></form></div></div><div class="card"><h3>Users</h3><table><tr><th>Email</th><th>Country</th><th>Balance</th></tr><tbody id="users"></tbody></table></div>
</main><script src="/js/app.js"></script></body></html>
